[Unit]
# Clear the legacy ephemeral-Redis dependencies before installing the real
# Provider-only regional dependency set.
After=
Wants=
Requires=
After=network-online.target sub2api-hk-state-tunnel.service a6-provider-valkey-hk.service
Wants=network-online.target
Requires=sub2api-hk-state-tunnel.service a6-provider-valkey-hk.service

[Service]
# EnvironmentFile values override the default-off Environment= entries in the
# base HK shadow unit. The global REDIS_* values stay in the base file; only
# PROVIDER_REDIS_* points to the independent local Valkey.
EnvironmentFile=
EnvironmentFile=/etc/sub2api-hk/sub2api-hk-shadow.env
EnvironmentFile=/etc/sub2api-hk/sub2api-hk-shadow-provider-regional.env
