# Dedicated Provider-coordination Valkey for the HK loopback candidate.
# The ACL file is rendered from a private deployment input; it is never copied
# from the global Redis used through the US state tunnel.
bind 127.0.0.1
protected-mode yes
port 6380
tcp-backlog 511
timeout 0
tcp-keepalive 60

daemonize no
supervised no
loglevel notice
logfile ""
databases 1
always-show-logo no

dir /var/lib/a6-provider-valkey-hk
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appenddirname appendonlydir
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

maxmemory-policy noeviction
lua-time-limit 5000
notify-keyspace-events ""
aclfile /etc/a6-provider-valkey-hk/users.acl
