[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a6api-auto"
version = "0.1.0"
description = "Pure-HTTP a6api account, key, and supplier application workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["curl-cffi>=0.11,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
trade = ["boto3>=1.35,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<7"]

[project.scripts]
a6api-auto = "a6api_auto.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
a6api_auto = ["data/*.html", "data/*.json", "data/*.xlsx", "data/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
